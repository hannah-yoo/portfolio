<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="weave" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="2" seed="3" stitchTiles="stitch" result="warp"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.9" numOctaves="2" seed="8" stitchTiles="stitch" result="weft"/>
    <feBlend in="warp" in2="weft" mode="multiply" result="cloth"/>
    <feColorMatrix in="cloth" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.90  0 0 0 0 0.84  0.9 0.9 0 0 -0.55"/>
  </filter>
  <rect width="320" height="320" fill="#f4efe4"/>
  <rect width="320" height="320" filter="url(#weave)"/>
</svg>
